name: QEMU Boot Test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  qemu-test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential meson ninja-build xorriso git nasm qemu-system-x86
    - name: Download Limine
      run: |
        git clone https://github.com/limine-bootloader/limine.git --branch=v7.x-binary --depth=1
        cd limine && sudo make install PREFIX=/usr && cd ..
    - name: Setup Meson
      run: meson setup build
    - name: Build CobraOS
      run: meson compile -C build
    - name: Boot in QEMU
      run: |
        stdbuf -o0 -e0 timeout 15s qemu-system-x86_64 -cdrom build/cobraos.iso -display none -debugcon stdio -m 256M 2>&1 | grep -q -m 1 "CobraOS booted" && echo "✅ Kernel boot successful" || (echo "❌ Kernel boot failed" && exit 1)
    - name: Upload QEMU log
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: qemu-output
        path: qemu-output.log
