name: QEMU Boot Test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  qemu-test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential meson ninja-build xorriso git nasm qemu-system-x86
    - name: Download Limine
      run: |
        git clone https://github.com/limine-bootloader/limine.git --branch=v7.x-binary --depth=1
        cd limine && sudo make install && cd ..
    - name: Setup Meson
      run: meson setup build
    - name: Build CobraOS
      run: meson compile -C build
    - name: Boot in QEMU
      run: |
        timeout 10 qemu-system-x86_64 -cdrom build/cobraos.iso -display none -serial stdio -m 256M 2>&1 | tee qemu-output.log || true
    - name: Check boot output
      run: |
        if grep -q "CobraOS booted" qemu-output.log; then
          echo "✅ Kernel boot successful"
          exit 0
        else
          echo "❌ Kernel boot failed"
          cat qemu-output.log
          exit 1
        fi
    - name: Upload QEMU log
      uses: actions/upload-artifact@v3
      if: always()
      with:
        name: qemu-output
        path: qemu-output.log
