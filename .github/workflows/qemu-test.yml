name: QEMU Boot Test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  qemu-test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential meson ninja-build xorriso git nasm qemu-system-x86
    - name: Download Limine
      run: |
        git clone https://github.com/limine-bootloader/limine.git --branch=v7.x-binary --depth=1
        cd limine && sudo make install PREFIX=/usr && cd ..
    - name: Setup Meson
      run: meson setup build
    - name: Build CobraOS
      run: meson compile -C build
    - name: Boot in QEMU
      run: |
        # Direktes Schreiben in die Datei verhindert Puffer-Verluste bei SIGTERM
        timeout 30s qemu-system-x86_64 \
          -cdrom build/cobraos.iso \
          -display none \
          -debugcon file:qemu-output.log \
          -serial file:qemu-output.log \
          -m 256M || true
    - name: Check boot output
      run: |
        if grep -q "CobraOS booted" qemu-output.log; then
          echo "✅ Kernel boot successful"
          exit 0
        else
          echo "❌ Kernel boot failed"
          cat qemu-output.log
          exit 1
        fi
    - name: Upload QEMU log
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: qemu-output
        path: qemu-output.log
